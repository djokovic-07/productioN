<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lançar Produção</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-green-950 text-white">

  <div class="md:hidden bg-green-900 p-4 flex justify-between items-center shadow-lg border-b border-green-800">
    <h1 class="text-xl font-bold text-green-400">Produção</h1>
    <button onclick="document.getElementById('menuLateral').classList.toggle('menu-aberto')" class="p-2 bg-green-800 rounded focus:outline-none hover:bg-green-700 transition">
      ☰ Menu
    </button>
  </div>

  <div class="flex flex-col md:flex-row min-h-screen">
    
    <aside id="menuLateral" class="sidebar w-64 bg-green-900 p-5 md:block flex-shrink-0 border-r border-green-800">
      <h1 class="text-2xl font-bold mb-10 hidden md:block text-green-400">Produção</h1>
      <nav class="flex flex-col gap-3">
        <a href="index.html" class="p-2 rounded hover:bg-green-800 hover:text-green-100 transition text-green-200">Dashboard</a>
        <a href="usuarios.html" class="p-2 rounded hover:bg-green-800 hover:text-green-100 transition text-green-200">Usuários</a>
        <a href="producao.html" class="bg-green-800 p-2 rounded text-green-100 font-semibold shadow">Produção</a>
      </nav>
    </aside>

    <main class="flex-1 p-4 md:p-6 flex justify-center items-start">
      <div class="w-full max-w-2xl">
        <h2 class="text-3xl font-bold mb-6 text-green-100">Lançar Produção</h2>
        
        <form id="formProducao" class="bg-green-900 p-6 md:p-8 rounded-2xl shadow-lg border border-green-800">
          <select id="usuario" class="w-full p-3 rounded bg-green-950 text-green-100 border border-green-700 focus:border-green-400 focus:ring-1 focus:ring-green-400 outline-none mb-4 transition">
            <option value="">Selecione o Funcionário</option>
          </select>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <input type="date" id="data" class="w-full p-3 rounded bg-green-950 text-green-100 border border-green-700 focus:border-green-400 focus:ring-1 focus:ring-green-400 outline-none transition">
            <div class="flex gap-2">
              <input type="time" id="entrada" title="Entrada" class="w-full p-3 rounded bg-green-950 text-green-100 border border-green-700 focus:border-green-400 focus:ring-1 focus:ring-green-400 outline-none transition">
              <input type="time" id="saida" title="Saída" class="w-full p-3 rounded bg-green-950 text-green-100 border border-green-700 focus:border-green-400 focus:ring-1 focus:ring-green-400 outline-none transition">
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <input type="number" id="caixas" placeholder="Qtd. de caixas" class="w-full p-3 rounded bg-green-950 text-green-100 border border-green-700 focus:border-green-400 focus:ring-1 focus:ring-green-400 outline-none transition placeholder-green-600">
            <input type="number" id="peso" placeholder="Peso total (kg)" class="w-full p-3 rounded bg-green-950 text-green-100 border border-green-700 focus:border-green-400 focus:ring-1 focus:ring-green-400 outline-none transition placeholder-green-600">
          </div>

          <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold px-5 py-3 rounded-lg shadow-lg hover:shadow-green-600/30 transition transform hover:-translate-y-0.5">
            Salvar Produção
          </button>
        </form>
      </div>
    </main>

  </div>

  <script src="js/supabase.js"></script>
</body>
</html>
