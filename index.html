<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="assets/icon.png" type="image/x-icon" />
  <title>Dashboard Produção</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-green-950 text-white">

  <div class="md:hidden bg-green-900 p-4 flex justify-between items-center shadow-lg border-b border-green-800">
    <h1 class="text-xl font-bold text-green-400">Produção</h1>
    <button onclick="document.getElementById('menuLateral').classList.toggle('menu-aberto')" class="p-2 bg-green-800 rounded focus:outline-none hover:bg-green-700 transition">
      ☰ Menu
    </button>
  </div>

  <div class="flex flex-col md:flex-row min-h-screen">

    <aside id="menuLateral" class="sidebar w-64 bg-green-900 p-5 md:block flex-shrink-0 border-r border-green-800">
      <h1 class="text-2xl font-bold mb-10 hidden md:block text-green-400">Produção</h1>
      <nav class="flex flex-col gap-3">
        <a href="index.html" class="bg-green-800 p-2 rounded text-green-100 font-semibold shadow">Dashboard</a>
        <a href="usuarios.html" class="p-2 rounded hover:bg-green-800 hover:text-green-100 transition text-green-200">Usuários</a>
        <a href="producao.html" class="p-2 rounded hover:bg-green-800 hover:text-green-100 transition text-green-200">Produção</a>
      </nav>
    </aside>

    <main class="flex-1 p-4 md:p-6 w-full overflow-hidden">
      
      <h2 class="text-3xl font-bold mb-6 text-green-100">Visão Geral</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-8">
        <div class="bg-green-900 p-5 rounded-2xl shadow-lg border border-green-800">
          <p class="text-green-300 mb-2 font-medium">Total Caixas</p>
          <p id="totalCaixas" class="text-3xl lg:text-4xl font-bold text-green-400">0</p>
        </div>
        <div class="bg-green-900 p-5 rounded-2xl shadow-lg border border-green-800">
          <p class="text-green-300 mb-2 font-medium">Peso Total</p>
          <p id="pesoTotal" class="text-3xl lg:text-4xl font-bold text-green-400">0kg</p>
        </div>
        <div class="bg-green-900 p-5 rounded-2xl shadow-lg border border-green-800">
          <p class="text-green-300 mb-2 font-medium">Média/Hora</p>
          <p id="mediaHora" class="text-3xl lg:text-4xl font-bold text-green-400">0</p>
        </div>
        <div class="bg-green-900 p-5 rounded-2xl shadow-lg border border-green-800">
          <p class="text-green-300 mb-2 font-medium">Funcionários</p>
          <p id="totalFuncionarios" class="text-3xl lg:text-4xl font-bold text-green-400">0</p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
        <div class="bg-green-900 rounded-2xl p-4 md:p-6 shadow-lg border border-green-800">
          <h3 class="text-xl md:text-2xl font-bold mb-5 text-green-100">Produção por Dia</h3>
          <div class="relative h-64 w-full">
            <canvas id="graficoProducao"></canvas>
          </div>
        </div>
        <div class="bg-green-900 rounded-2xl p-4 md:p-6 shadow-lg border border-green-800">
          <h3 class="text-xl md:text-2xl font-bold mb-5 text-green-100">Produção Funcionários</h3>
          <div class="relative h-64 w-full">
            <canvas id="graficoFuncionarios"></canvas>
          </div>
        </div>
      </div>

      <div class="bg-green-900 rounded-2xl p-4 md:p-6 shadow-lg border border-green-800">
        <h3 class="text-xl md:text-2xl font-bold mb-6 text-green-100">Últimos Registros</h3>
        <div class="table-responsive">
          <table class="w-full text-left border-collapse min-w-[600px]">
            <thead>
              <tr class="border-b border-green-700 text-green-300">
                <th class="p-3">Funcionário</th>
                <th class="p-3">Data</th>
                <th class="p-3">Caixas</th>
                <th class="p-3">Peso Total</th>
                <th class="p-3">Cx/Hora</th>
              </tr>
            </thead>
            <tbody id="tabelaRegistros" class="divide-y divide-green-800/50">
              </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
